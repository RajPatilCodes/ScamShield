services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scamshield
      POSTGRES_USER: scamshield
      POSTGRES_PASSWORD: scamshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scamshield -d scamshield"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://scamshield:scamshield@db:5432/scamshield
      JWT_SECRET: change-me-in-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
